{%load static%}
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="{%static 'BulletIn/stylesheets/bgstyle.css'%}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Giriş Yap</title>
</head>
<body>
    {%if form.errors%}
    <div style="padding: 15px;">
        <h3 style="width: fit-content;background-color: white;">Giriş bilgileriniz hatalı</h3>
    </div>
    {%endif%}
    {%if user.is_authenticated%}
        <div style="width: fit-content; border: 3px black solid; background-color: white;">
            <h2 style="margin-top: 10px; background-color: white;">Merhaba {{user.username}}</h2>
            <a href="{% url 'BulletIn:showBulletin' %}" class="btn btn-primary" style="width: 100%;">Bültene git</a>
        </div>
    {%else%}
    <div style="display: flex; gap: 15px; align-items: center; margin: 20px;background-color: white;width: fit-content;" >
        <div style="padding: 5px;">
            <img src="{%static 'BulletIn/images/tfflogo.png'%}" alt="TFF" width="90" height="110">
        </div>
        <div style="padding: 15px;  border-radius: 8px;">
            <form method="POST" action="{%url 'login'%}" class="text-end">
                {%csrf_token%}
                {%for field in form%}
                    <div class="mb-3">
                    {{field.label_tag}}
                    {{field}}
                    </div>
            {%endfor%}
                <button type="submit" class="btn btn-primary" style="width: 100%;">Giriş Yap</button>
            </form>
        </div>
    </div>
    {%endif%}
</body>
</html>
